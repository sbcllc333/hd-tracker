name: Walmart test

on:
  workflow_dispatch:
  push:
    branches: [claude/brightdata-test]
    paths: ["probe/walmart_probe.py", ".github/workflows/walmart-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Walmart sources
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python probe/walmart_probe.py
