name: Daily Penny Run scan

on:
  schedule:
    - cron: "17 11 * * *"   # about 6:17 AM Jacksonville time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/run-now.txt"]   # touching this file starts an extra scan

permissions:
  contents: write

concurrency: penny-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan one store
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
        run: python tracker.py
      - name: Save results
        run: |
          git config user.name "penny-run-bot"
          git config user.email "penny-run-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Scan $(date +%F)" || echo "Nothing new"
          git push
