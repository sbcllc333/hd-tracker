name: Daily Home Depot check

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tracker
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tracker.py
      - name: Save results
        run: |
          git config user.name "hd-tracker-bot"
          git config user.email "hd-tracker-bot@users.noreply.github.com"
          git add data docs
          git commit -m "Daily snapshot $(date +%F)" || echo "Nothing new"
          git push
