name: Daily Penny Run build

on:
  schedule:
    - cron: "17 11 * * *"   # about 6:17 AM Jacksonville time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/leads.json"
      - "config.json"
      - "tools/**"
      - "tracker.py"
      - ".github/workflows/daily.yml"

permissions:
  contents: write

concurrency: penny-run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the lead book
        run: python tools/build.py
      - name: Save results
        run: |
          git config user.name "penny-run-bot"
          git config user.email "penny-run-bot@users.noreply.github.com"
          git add docs/data.json
          git commit -m "Build $(date +%F)" || echo "Nothing new"
          git pull --rebase -X theirs origin main
          git push
