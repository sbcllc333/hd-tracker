name: Apify test

on:
  workflow_dispatch:
  push:
    branches: [claude/brightdata-test]
    paths: ["probe/apify_probe.py", ".github/workflows/apify-probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python probe/apify_probe.py
