<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penny Run</title>
<meta name="description" content="Clearance and penny-item tracker for my local stores.">
<meta name="theme-color" content="#0B5D4E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1413" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <div class="brand"><img src="icons/icon-192.png" alt="" width="32" height="32"><div><h1>Penny Run</h1><p id="updated">Loading…</p></div></div>
  <button id="install" class="textbtn" hidden>Install</button>
</header>
<div id="stores" class="chips sticky" role="tablist" aria-label="Store"></div>
<div id="banner" class="banner" hidden></div>
<main id="view" tabindex="-1"></main>
<nav class="nav" aria-label="Sections">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z"/></svg><span>Today</span></button>
  <button data-tab="browse"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 015.6 11.2l5.1 5.1-1.4 1.4-5.1-5.1A7 7 0 1110 3zm0 2a5 5 0 100 10 5 5 0 000-10z"/></svg><span>Browse</span></button>
  <button data-tab="run"><svg viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5L4 14.1 9 19 20 8l-1.4-1.4zM4 5h10v2H4z"/></svg><span>Run List</span><i id="runcount" hidden></i></button>
  <button data-tab="history"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 11-7.7 10h2.1A6 6 0 1012 6V4zm-1 4h2v4.4l3 1.8-1 1.7-4-2.4zM4 4l4 1-3 3z"/></svg><span>History</span></button>
</nav>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog"></section>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
